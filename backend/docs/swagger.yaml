basePath: /
definitions:
  backend_routes_handlers.bonusRequest:
    properties:
      first_name:
        example: Egor
        type: string
      user_id:
        example: 123456789
        type: integer
      username:
        example: egorka
        type: string
    type: object
  backend_routes_handlers.clanAPIResponse:
    properties:
      code:
        type: string
      data: {}
      error:
        type: string
      ok:
        example: true
        type: boolean
    type: object
  backend_routes_handlers.clanRequest:
    properties:
      chat_type:
        example: private
        type: string
      code:
        example: INVITE123
        type: string
      duration:
        example: 12h
        type: string
      first_name:
        example: Egor
        type: string
      name:
        example: FlorenSquad
        type: string
      reason:
        example: нарушение правил клана
        type: string
      target_id:
        example: 987654321
        type: integer
      user_id:
        example: 123456789
        type: integer
      username:
        example: egorka
        type: string
    type: object
  backend_routes_handlers.moderAPIResponse:
    properties:
      code:
        type: string
      data: {}
      error:
        type: string
      ok:
        example: true
        type: boolean
    type: object
  backend_routes_handlers.prepareMuteRequest:
    properties:
      duration_str:
        example: 1h
        type: string
      reason:
        example: флуд
        type: string
      reply_user_id:
        example: 123456789
        type: integer
      username_arg:
        example: '@egorka'
        type: string
    type: object
  backend_routes_handlers.profileInitRequest:
    properties:
      first_name:
        example: Egor
        type: string
      user_id:
        example: 123456789
        type: integer
      username:
        example: egorka
        type: string
    type: object
  backend_routes_handlers.promoAPIResponse:
    properties:
      code:
        type: string
      data: {}
      error:
        type: string
      ok:
        example: true
        type: boolean
    type: object
  backend_routes_handlers.promoRequest:
    properties:
      amount:
        example: 500
        type: number
      amount_int:
        example: 500
        type: integer
      chat_id:
        example: -1001234567890
        type: integer
      code:
        example: FLOREN2026
        type: string
      duration:
        example: 24h
        type: string
      first_name:
        example: Egor
        type: string
      user_id:
        example: 123456789
        type: integer
      username:
        example: egorka
        type: string
    type: object
  backend_routes_handlers.promoStatItem:
    properties:
      code:
        example: FLOREN2026
        type: string
      created_at:
        example: 24.11.2026
        type: string
      updated_at:
        example: '-'
        type: string
      users:
        example: 15
        type: integer
    type: object
  backend_routes_handlers.resolveTargetRequest:
    properties:
      reason:
        example: спам
        type: string
      reply_user_id:
        example: 123456789
        type: integer
      username_arg:
        example: '@egorka'
        type: string
    type: object
  backend_routes_handlers.standardAPIResponse:
    properties:
      code:
        type: string
      data:
        $ref: '#/definitions/backend_routes_handlers.standardDataPayload'
      error:
        type: string
      ok:
        example: true
        type: boolean
    type: object
  backend_routes_handlers.standardDataPayload:
    properties:
      bonus_amount:
        example: 100
        type: integer
      chat_title:
        type: string
      is_admin:
        example: false
        type: boolean
      is_creator:
        example: false
        type: boolean
      is_creator_in_chat:
        type: boolean
      is_owner_or_creator:
        example: false
        type: boolean
      is_vip:
        example: true
        type: boolean
      new_balance:
        example: 500
        type: number
      profile:
        $ref: '#/definitions/florenbot_backend_engine_structs.User'
      remaining_hours:
        example: 12
        type: number
      role_display:
        type: string
      role_name:
        example: Гость
        type: string
      role_short:
        example: moderator
        type: string
      users:
        items:
          $ref: '#/definitions/florenbot_backend_engine_structs.User'
        type: array
    type: object
  backend_routes_handlers.startGroupRequest:
    properties:
      chat_id:
        example: -1001234567890
        type: integer
      chat_title:
        example: Test Chat
        type: string
      first_name:
        example: Egor
        type: string
      user_id:
        example: 123456789
        type: integer
      username:
        example: egorka
        type: string
    type: object
  backend_routes_handlers.vipRequest:
    properties:
      user_id:
        example: 123456789
        type: integer
    type: object
  florenbot_backend_engine_structs.User:
    properties:
      balance:
        description: Финансовые поля (float64 для простых расчетов)
        type: number
      clan_id:
        type: integer
      created_at:
        type: string
      euro:
        type: number
      first_name:
        type: string
      floren_coin:
        type: number
      id:
        description: ID типа uint64 соответствует формату Telegram ID
        type: integer
      last_bonus_at:
        type: string
      losses:
        type: integer
      message_count:
        type: integer
      negative_reputation:
        type: integer
      positive_reputation:
        type: integer
      promocode:
        type: string
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
      vip:
        type: integer
      vip_active_at:
        description: Автоматические поля времени
        type: string
      wins:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API бэкенда для FlorenBot
  title: FlorenBot REST API
  version: "1.0"
paths:
  /api/v1/clans:
    get:
      description: Возвращает список всех зарегистрированных кланов
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Список всех кланов
      tags:
      - clans
    post:
      consumes:
      - application/json
      description: Создаёт новый клан при достаточном балансе пользователя (стоимость
        1000)
      parameters:
      - description: Данные для создания клана
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_routes_handlers.clanRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "402":
          description: Payment Required
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Создание клана
      tags:
      - clans
  /api/v1/clans/join:
    post:
      consumes:
      - application/json
      description: Добавляет пользователя в клан по коду приглашения (только вне групповых
        чатов)
      parameters:
      - description: Данные для вступления в клан
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_routes_handlers.clanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Вступление в клан по инвайт-коду
      tags:
      - clans
  /api/v1/clans/leave:
    post:
      consumes:
      - application/json
      description: Позволяет участнику (кроме владельца) выйти из текущего клана
      parameters:
      - description: ID пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_routes_handlers.clanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Выход из клана
      tags:
      - clans
  /api/v1/clans/me:
    delete:
      description: Удаляет клан, если пользователь является его владельцем
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Удаление своего клана
      tags:
      - clans
    get:
      description: Возвращает информацию о клане, в котором состоит пользователь
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Текущий клан пользователя
      tags:
      - clans
  /api/v1/clans/me/ban:
    post:
      consumes:
      - application/json
      description: Блокирует целевого участника в клане с указанием причины (доступно
        admin и owner)
      parameters:
      - description: Параметры блокировки участника
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_routes_handlers.clanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Блокировка участника в клане
      tags:
      - clans
  /api/v1/clans/me/invite-code:
    delete:
      description: Удаляет действующий инвайт-код клана (доступно admin и owner)
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      - description: Тип чата
        in: query
        name: chat_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Удаление инвайт-кода клана
      tags:
      - clans
    get:
      description: Возвращает текущий инвайт-код клана (доступно admin и owner)
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Получение инвайт-кода клана
      tags:
      - clans
    post:
      consumes:
      - application/json
      description: Генерирует и сохраняет новый инвайт-код для клана (доступно admin
        и owner)
      parameters:
      - description: Данные пользователя и тип чата
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_routes_handlers.clanRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Создание инвайт-кода клана
      tags:
      - clans
  /api/v1/clans/me/invite-code/expire:
    delete:
      description: Удаляет активный таймер истечения инвайт-кода клана из Redis
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      - description: Тип чата
        in: query
        name: chat_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Удаление срока действия инвайт-кода
      tags:
      - clans
    post:
      consumes:
      - application/json
      description: Задаёт время жизни инвайт-кода клана и сохраняет таймер в Redis
      parameters:
      - description: Данные пользователя, тип чата и длительность
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_routes_handlers.clanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Установка срока действия инвайт-кода
      tags:
      - clans
  /api/v1/clans/me/invite-code/revoke:
    post:
      consumes:
      - application/json
      description: Отзывает текущий инвайт-код и выпускает новый (доступно admin и
        owner)
      parameters:
      - description: Данные пользователя и тип чата
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_routes_handlers.clanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Перевыпуск инвайт-кода клана
      tags:
      - clans
  /api/v1/clans/me/kick:
    post:
      consumes:
      - application/json
      description: Исключает целевого участника из клана по причине (доступно admin
        и owner)
      parameters:
      - description: Параметры исключения участника
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_routes_handlers.clanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Исключение участника из клана
      tags:
      - clans
  /api/v1/clans/me/members:
    get:
      description: Возвращает список участников клана текущего пользователя с фильтрацией
        active или noactive
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      - default: active
        description: Фильтр участников (active или noactive)
        in: query
        name: filter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Участники клана
      tags:
      - clans
  /api/v1/clans/me/role:
    get:
      description: Возвращает текущую роль пользователя в его клане
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_routes_handlers.clanAPIResponse'
      summary: Роль пользователя в клане
      tags:
      - clans
  /api/v1/moders/delete-check:
    get:
      description: Проверяет корректность user_id и chat_id, а также наличие пользователя
        и чата в БД
      parameters:
      - description: ID пользователя
