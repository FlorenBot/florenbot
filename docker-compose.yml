services:
  bot:
    image: ghcr.io/florenbot/florenbot:latest
    container_name: florenbot
    restart: always
    env_file:
      - .env.docker
    depends_on:
      - mariadb
      - redis
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_ENGINE: redis
      REDIS_DB: 0
      DEBUG: false
      DB_ENGINE: mysql
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ADDR: redis:6379
      GODEBUG: netdns=go
      FORCE_IPV4: "true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - florenbot

  adminer:
    image: docker.io/library/adminer:latest
    container_name: florenbot_adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    ports:
      - "8080:8080"
    networks:
      - florenbot
    depends_on:
      - mariadb

  mariadb:
    image: docker.io/mariadb:10.11
    container_name: florenbot_mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - florenbot

  redis:
    image: docker.io/library/redis:alpine
    container_name: florenbot_redis
    restart: always
    command: ["redis-server", "--bind", "0.0.0.0", "--requirepass", "${REDIS_PASSWORD}", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - florenbot

volumes:
  db_data:
  redis_data:

networks:
  florenbot:
    driver: bridge
    external: false