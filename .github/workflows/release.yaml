name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Версия релиза (например, v1.0.0)'
        required: true
        default: 'v1.0.0'
      message:
        description: 'Описание (changelog) для релиза и ТГ'
        required: false
        default: ''

jobs:
  # --- ОПРЕДЕЛЕНИЕ ТЕГА И ВЕРСИИ ---
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.VERSION }}
      custom_msg: ${{ steps.tag.outputs.CUSTOM_MSG }}
    steps:
      - name: Get release tag and message
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            echo "CUSTOM_MSG=${{ github.event.inputs.message }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "CUSTOM_MSG=" >> $GITHUB_OUTPUT
          fi

  # --- СБОРКА ДЛЯ LINUX И ANDROID (TERMUX) ---
  build-unix:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Linux amd64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -v -o florenbot ./bot
          tar -czvf florenbot-linux-amd64.tar.gz florenbot
          rm florenbot

      - name: Build Linux ARM64 (Raspberry Pi) binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -v -o florenbot-rpi ./bot
          tar -czvf florenbot-linux-arm64.tar.gz florenbot-rpi
          rm florenbot-rpi

      - name: Build Android Termux (aarch64) binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -v -o florenbot-termux ./bot
          tar -czvf florenbot-android-aarch64.tar.gz florenbot-termux
          rm florenbot-termux

      - name: Create SHA256 and GPG Signatures
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          sha256sum florenbot-linux-amd64.tar.gz > florenbot-linux-amd64.tar.gz.sha256
          sha256sum florenbot-linux-arm64.tar.gz > florenbot-linux-arm64.tar.gz.sha256
          sha256sum florenbot-android-aarch64.tar.gz > florenbot-android-aarch64.tar.gz.sha256

          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpg --batch --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --detach-sign --armor florenbot-linux-amd64.tar.gz
          gpg --batch --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --detach-sign --armor florenbot-linux-arm64.tar.gz
          gpg --batch --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --detach-sign --armor florenbot-android-aarch64.tar.gz

      - name: Upload Unix Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unix-artifacts
          path: |
            florenbot-linux-amd64.tar.gz*
            florenbot-linux-arm64.tar.gz*
            florenbot-android-aarch64.tar.gz*

  # --- СБОРКА ДЛЯ WINDOWS И ПОДПИСЬ ---
  build-windows:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install 7-Zip and osslsigncode
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full p7zip-rar osslsigncode

      - name: Build Windows binary
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -v -o florenbot.exe ./bot

      - name: Sign Windows binary
        run: |
          echo "${{ secrets.WIN_CERT_BASE64 }}" | base64 --decode > cert.pfx
          osslsigncode sign \
            -pkcs12 cert.pfx \
            -pass "${{ secrets.WIN_CERT_PASSWORD }}" \
            -n "FlorenBot" \
            -i "https://github.com/${{ github.repository }}" \
            -ts "http://timestamp.digicert.com" \
            -in florenbot.exe \
            -out florenbot_signed.exe
          mv florenbot_signed.exe florenbot.exe

      - name: Create Windows Light SFX Archive and ZIP
        run: |
          cat << 'EOF' > sfx_config.txt
          ;!@Install@!UTF-8!
          Title="FlorenBot Light Setup"
          BeginPrompt="Запустить установку FlorenBot Light (требуются запущенные Redis и MariaDB)?"
          RunProgram="floren_setup_env.bat"
          ;!@InstallEnd@!
          EOF

          cat << 'EOF' > floren_setup_env.bat
          @echo off
          TITLE FlorenBot Light Launcher
          echo [INFO] Checking environment for FlorenBot...
          echo [INFO] Note: Ensure MariaDB and Redis services are active locally.
          if not exist ".env" (
              echo [WARNING] .env file not found. Creating a template...
              echo DB_HOST=localhost > .env
              echo DB_PORT=3306 >> .env
              echo REDIS_HOST=localhost >> .env
              echo REDIS_PORT=6379 >> .env
          )
          echo [INFO] Starting FlorenBot...
          start florenbot.exe
          EOF

          7z a -t7z florenbot_payload.7z florenbot.exe floren_setup_env.bat

          curl -L -o 7z.sfx "https://raw.githubusercontent.com/jinod/p7zip/master/CPP/7zip/UI/Console/7z.sfx" || \
          curl -L -o 7z.sfx "https://raw.githubusercontent.com/theonlyicecutter/7z-sfx/master/7z.sfx"

          cat 7z.sfx sfx_config.txt florenbot_payload.7z > florenbot-windows-amd64-light-sfx.exe

          sha256sum florenbot.exe > florenbot.exe.sha256
          zip florenbot-windows-amd64.zip florenbot.exe florenbot.exe.sha256
          sha256sum florenbot-windows-amd64.zip > florenbot-windows-amd64.zip.sha256
          sha256sum florenbot-windows-amd64-light-sfx.exe > florenbot-windows-amd64-light-sfx.exe.sha256

      - name: Sign Windows Archives with GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpg --batch --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --detach-sign --armor florenbot-windows-amd64.zip
          gpg --batch --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --detach-sign --armor florenbot-windows-amd64-light-sfx.exe

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            florenbot-windows-amd64.zip*
            florenbot-windows-amd64-light-sfx.exe*

  # --- ПУБЛИКАЦИЯ РЕЛИЗА И УВЕДОМЛЕНИЕ ---
  release:
    needs: [build-unix, build-windows, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-splitter: /
          merge-multiple: true

      - name: Create publickey.asc file
        run: |
          cat << 'EOF' > artifacts/publickey.asc
          ${{ secrets.GPG_PUBLIC_KEY }}
          EOF

      - name: Publish Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: artifacts/*

      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
          CUSTOM_MSG: ${{ needs.prepare.outputs.custom_msg }}
          REPO_URL: "https://github.com/${{ github.repository }}"
        run: |
          RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"
          DESC_SECTION=""
          if [ -n "$CUSTOM_MSG" ]; then
            DESC_SECTION="%0A%0A📝 **Описание:**%0A${CUSTOM_MSG}"
          fi

          MESSAGE="🔔 **Новое обновление**%0A%0A📦 **Версия:** \`${RELEASE_TAG}\`${DESC_SECTION}%0A%0A🔗 [Смотреть релиз и скачать файлы](${RELEASE_URL})%0A%0AДоступны свежие сборки для Linux (amd64, arm64), Android Termux (aarch64) и Windows."
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CH_ID:-$TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}"
