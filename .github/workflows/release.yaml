          gpg --batch --pinentry-mode loopback --detach-sign --armor florenbot-windows-amd64-light-sfx.exe

      - name: Create publickey.asc file
        run: |
          cat << 'EOF' > publickey.asc
          ${{ secrets.GPG_PUBLIC_KEY }}
          EOF

      # --- ПУБЛИКАЦИЯ РЕЛИЗА ---
      - name: Publish Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.VERSION }}
          files: |
            florenbot-linux-amd64.tar.gz
            florenbot-linux-amd64.tar.gz.asc
            florenbot-linux-amd64.tar.gz.sha256
            florenbot-linux-arm64.tar.gz
            florenbot-linux-arm64.tar.gz.asc
            florenbot-linux-arm64.tar.gz.sha256
            florenbot-android-aarch64.tar.gz
            florenbot-android-aarch64.tar.gz.asc
            florenbot-android-aarch64.tar.gz.sha256
            florenbot-windows-amd64.zip
            florenbot-windows-amd64.zip.asc
            florenbot-windows-amd64.zip.sha256
            florenbot-windows-amd64-light-sfx.exe
            florenbot-windows-amd64-light-sfx.exe.asc
            florenbot-windows-amd64-light-sfx.exe.sha256
            publickey.asc

      # --- ОТПРАВКА УВЕДОМЛЕНИЯ В TELEGRAM БОТ ---
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ steps.tag.outputs.VERSION }}
          CUSTOM_MSG: ${{ steps.tag.outputs.CUSTOM_MSG }}
          REPO_URL: "https://github.com/${{ github.repository }}"
        run: |
          RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"
          
          DESC_SECTION=""
          if [ -n "$CUSTOM_MSG" ]; then
            DESC_SECTION="%0A%0A📝 **Описание:**%0A${CUSTOM_MSG}"
          fi

          MESSAGE="🔔 **Новое обновление**%0A%0A📦 **Версия:** \`${RELEASE_TAG}\`${DESC_SECTION}%0A%0A🔗 [Смотреть релиз и скачать файлы](${RELEASE_URL})%0A%0AДоступны свежие сборки для Linux (amd64, arm64 для Raspberry Pi), Android (Termux aarch64) и Windows."
          
          curl -s -X POST "[https://api.telegram.org/bot$](https://api.telegram.org/bot$){TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CH_ID:-$TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MESSAGE}"
