          fi

      # Установка 7-Zip CLI (p7zip-full)
      - name: Install 7-Zip
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full p7zip-rar

      # --- СБОРКА ДЛЯ LINUX (AMD64) ---
      - name: Build Linux amd64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -v -o florenbot ./bot
          tar -czvf florenbot-linux-amd64.tar.gz florenbot
          rm florenbot

      # --- СБОРКА ДЛЯ RASPBERRY PI (LINUX ARM64 / AARCH64) ---
      - name: Build Linux ARM64 (Raspberry Pi) binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -v -o florenbot-rpi ./bot
          tar -czvf florenbot-linux-arm64.tar.gz florenbot-rpi
          rm florenbot-rpi

      # --- СБОРКА ДЛЯ ANDROID TERMUX (AARCH64) ---
      - name: Build Android Termux (aarch64) binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -v -o florenbot-termux ./bot
          tar -czvf florenbot-android-aarch64.tar.gz florenbot-termux
          rm florenbot-termux

      # --- СБОРКА ДЛЯ WINDOWS ---
      - name: Build Windows binary
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -v -o florenbot.exe ./bot

      # --- ПОДПИСЬ WINDOWS EXECUTABLE (OSSLSIGNCODE) ---
      - name: Install osslsigncode
        run: |
          sudo apt-get update && sudo apt-get install -y osslsigncode

      - name: Decode Windows Certificate
        run: |
          echo "${{ secrets.WIN_CERT_BASE64 }}" | base64 --decode > cert.pfx

      - name: Sign Windows binary
        run: |
          osslsigncode sign \
            -pkcs12 cert.pfx \
            -pass "${{ secrets.WIN_CERT_PASSWORD }}" \
            -n "FlorenBot" \
            -i "[https://github.com/$](https://github.com/$){{ github.repository }}" \
            -ts "[http://timestamp.digicert.com](http://timestamp.digicert.com)" \
            -in florenbot.exe \
            -out florenbot_signed.exe
          mv florenbot_signed.exe florenbot.exe

      # --- СОЗДАНИЕ LIGHT SFX АРХИВА ДЛЯ WINDOWS ---
      - name: Create Windows Light SFX Archive
        run: |
          cat << 'EOF' > sfx_config.txt
          ;!@Install@!UTF-8!
          Title="FlorenBot Light Setup"
          BeginPrompt="Запустить установку FlorenBot Light (требуются запущенные Redis и MariaDB)?"
          RunProgram="floren_setup_env.bat"
          ;!@InstallEnd@!
          EOF

          cat << 'EOF' > floren_setup_env.bat
          @echo off
          TITLE FlorenBot Light Launcher
          echo [INFO] Checking environment for FlorenBot...
          echo [INFO] Note: Ensure MariaDB and Redis services are active locally.
          
          if not exist ".env" (
              echo [WARNING] .env file not found. Creating a template...
              echo DB_HOST=localhost > .env
              echo DB_PORT=3306 >> .env
              echo REDIS_HOST=localhost >> .env
              echo REDIS_PORT=6379 >> .env
          )
          
          echo [INFO] Starting FlorenBot...
          start florenbot.exe
          EOF

          7z a -t7z florenbot_payload.7z florenbot.exe floren_setup_env.bat

          echo "[INFO] Downloading 7z.sfx module..."
          curl -L -o 7z.sfx "[https://raw.githubusercontent.com/jinod/p7zip/master/CPP/7zip/UI/Console/7z.sfx](https://raw.githubusercontent.com/jinod/p7zip/master/CPP/7zip/UI/Console/7z.sfx)" || \
          curl -L -o 7z.sfx "[https://raw.githubusercontent.com/theonlyicecutter/7z-sfx/master/7z.sfx](https://raw.githubusercontent.com/theonlyicecutter/7z-sfx/master/7z.sfx)"

          if [ ! -s "7z.sfx" ]; then
            echo "[ERROR] 7z.sfx module is missing or empty!"
            exit 1
          fi

          cat 7z.sfx sfx_config.txt florenbot_payload.7z > florenbot-windows-amd64-light-sfx.exe
          echo "[INFO] SFX archive created successfully."

      # --- СОЗДАНИЕ SHA256 ХЕШЕЙ И АРХИВОВ ---
      - name: Create SHA256 sums and package Windows zip
        run: |
          sha256sum florenbot.exe > florenbot.exe.sha256
          zip florenbot-windows-amd64.zip florenbot.exe florenbot.exe.sha256
          
          sha256sum florenbot-windows-amd64.zip > florenbot-windows-amd64.zip.sha256
          sha256sum florenbot-windows-amd64-light-sfx.exe > florenbot-windows-amd64-light-sfx.exe.sha256
          sha256sum florenbot-linux-amd64.tar.gz > florenbot-linux-amd64.tar.gz.sha256
          sha256sum florenbot-linux-arm64.tar.gz > florenbot-linux-arm64.tar.gz.sha256
          sha256sum florenbot-android-aarch64.tar.gz > florenbot-android-aarch64.tar.gz.sha256

      # --- GPG ПОДПИСЬ ---
      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign archives with GPG
        run: |
          gpg --batch --pinentry-mode loopback --detach-sign --armor florenbot-linux-amd64.tar.gz
          gpg --batch --pinentry-mode loopback --detach-sign --armor florenbot-linux-arm64.tar.gz
          gpg --batch --pinentry-mode loopback --detach-sign --armor florenbot-android-aarch64.tar.gz
